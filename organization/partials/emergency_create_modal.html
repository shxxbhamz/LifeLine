<!-- Shared Real Emergency Request Modal -->
<div id="globalEmergencyModal" class="emergency-modal-overlay">
    <div class="emergency-modal-content">

        <h3>Create Emergency Donation Request</h3>

        <form id="emergencyRequestForm"
              method="POST"
              action="{% url 'staff_create_emergency_request' %}">

            {% csrf_token %}

            <input type="hidden"
                   name="idempotency_key"
                   value="{{ emergency_form_token }}">

            <!-- Blood Component -->
            <div class="em-form-group">
                <label for="emComponentType">
                    Blood Component:
                </label>

                <select id="emComponentType"
                        name="component_type"
                        required>

                    <option value=""
                            disabled
                            selected>
                        Select component
                    </option>

                    <option value="WHOLE_BLOOD">
                        Whole Blood
                    </option>

                    <option value="RED_BLOOD_CELLS">
                        Red Blood Cells
                    </option>

                    <option value="PLASMA">
                        Plasma
                    </option>

                    <option value="PLATELETS">
                        Platelets
                    </option>
                </select>
            </div>

            <!-- Required Blood Type -->
            <div class="em-form-group">
                <label for="emBloodGroup">
                    Required Blood Type:
                </label>

                <select id="emBloodGroup"
                        name="required_blood_type"
                        required>

                    <option value=""
                            disabled
                            selected>
                        Select blood type
                    </option>

                    <option value="ANY">
                        Any Compatible Type
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <!-- Units Required -->
            <div class="em-form-group">
                <label for="emUnitsRequired">
                    Units Required:
                </label>

                <input type="number"
                       id="emUnitsRequired"
                       name="units_required"
                       min="1"
                       step="1"
                       placeholder="e.g. 2"
                       required>
            </div>

            <!-- Urgency -->
            <div class="em-form-group">
                <label for="emUrgency">
                    Urgency:
                </label>

                <select id="emUrgency"
                        name="urgency"
                        required>

                    <option value=""
                            disabled
                            selected>
                        Select urgency
                    </option>

                    <option value="URGENT">
                        Urgent
                    </option>

                    <option value="CRITICAL">
                        Critical
                    </option>
                </select>
            </div>

            <!-- Donor Search Radius -->
            <div class="em-form-group">
                <label for="emRadius">
                    Donor Search Radius (km):
                </label>

                <input type="number"
                       id="emRadius"
                       name="radius_km"
                       min="1"
                       step="1"
                       value="25"
                       required>
            </div>

            <!-- Notes -->
            <div class="em-form-group">
                <label for="emDescription">
                    Emergency Description / Case Details:
                </label>

                <textarea id="emDescription"
                          name="notes"
                          placeholder="e.g. Critical trauma case requiring immediate blood units..."></textarea>
            </div>

            <!-- Actions -->
            <div class="em-modal-actions">

                <button type="button"
                        class="em-btn-secondary"
                        onclick="closeEmergencyModal()">
                    Cancel
                </button>

                <button type="submit"
                        class="em-btn-danger">
                    Create Emergency Request
                </button>

            </div>

        </form>

    </div>
</div>
