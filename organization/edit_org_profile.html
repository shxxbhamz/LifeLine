{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeLine - Edit Organization Profile</title>

    <!-- Original centralized stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* Locked fields */
        .locked-field {
            background-color: #f1f1f1;
            cursor: pointer;
        }

        /* Custom popup */
        .custom-popup-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .custom-popup {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .custom-popup p {
            margin-bottom: 20px;
            line-height: 1.6;
            color: #333;
        }

        .custom-popup button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .popup-success {
            border-top: 5px solid #2e9d62;
        }

        .popup-error {
            border-top: 5px solid #d9534f;
        }

        .popup-info {
            border-top: 5px solid #2878a8;
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <header>

        <a href="{% url 'home' %}" class="logo-link">
            <img src="{% static 'img/lifeline-logo.png' %}"
                 alt="LifeLine Logo"
                 class="brand-logo">
        </a>

        <nav>
            <ul>
                <li>
                    <a href="{% url 'home' %}#about">About Us</a>
                </li>

                <li>
                    <a href="{% url 'home' %}">Home</a>
                </li>
            </ul>
        </nav>

    </header>


    <!-- MAIN CONTENT AREA -->
    <main>

        <div class="auth-container">

            <h2>Edit Organization Profile</h2>

            <form action="{% url 'staff_edit_profile' %}"
                  method="POST"
                  class="auth-form">

                {% csrf_token %}

                <div class="form-grid">

                    <!-- EMPLOYEE ID - LOCKED -->
                    <div class="form-group">

                        <label for="username">Employee ID:</label>

                        <input type="text"
                               id="username"
                               value="{{ user.username }}"
                               class="locked-field"
                               readonly
                               onclick="showLockedPopup()">

                    </div>


                    <!-- WORK EMAIL - LOCKED -->
                    <div class="form-group">

                        <label for="email">Work Email Address:</label>

                        <input type="email"
                               id="email"
                               value="{{ user.email }}"
                               class="locked-field"
                               readonly
                               onclick="showLockedPopup()">

                    </div>


                    <!-- ORGANIZATION NAME - LOCKED -->
                    <div class="form-group full-width">

                        <label for="organization">Organization Name:</label>

                        <input type="text"
                               id="organization"
                               value="{{ facility.name }}"
                               class="locked-field"
                               readonly
                               onclick="showLockedPopup()">

                    </div>


                    <!-- FIRST NAME -->
                    <div class="form-group">

                        <label for="firstName">First Name:</label>

                        <input type="text"
                               id="firstName"
                               name="firstName"
                               value="{{ form_data.firstName|default:user.first_name }}"
                               required>

                    </div>


                    <!-- LAST NAME -->
                    <div class="form-group">

                        <label for="lastName">Last Name:</label>

                        <input type="text"
                               id="lastName"
                               name="lastName"
                               value="{{ form_data.lastName|default:user.last_name }}"
                               required>

                    </div>


                    <!-- ORGANIZATION PHONE NUMBER -->
                    <div class="form-group">

                        <label for="phone">Organization Phone Number:</label>

                        <input type="tel"
                               id="phone"
                               name="phone"
                               value="{{ form_data.phone|default:facility.phone }}"
                               required>

                    </div>


                    <!-- FACILITY TYPE -->
                    <div class="form-group">

                        <label for="facilityType">Facility Type:</label>

                        <select id="facilityType"
                                name="facilityType"
                                required>

                            <option value="" disabled
                                {% if not form_data.facilityType and not facility.facility_type %}selected{% endif %}>
                                Select facility type
                            </option>

                            <option value="HOSPITAL"
                                {% if form_data.facilityType == "HOSPITAL" or not form_data.facilityType and facility.facility_type == "HOSPITAL" %}selected{% endif %}>
                                Hospital
                            </option>

                            <option value="BLOOD_BANK"
                                {% if form_data.facilityType == "BLOOD_BANK" or not form_data.facilityType and facility.facility_type == "BLOOD_BANK" %}selected{% endif %}>
                                Blood Bank
                            </option>

                        </select>

                    </div>


                    <!-- FULL ADDRESS -->
                    <div class="form-group full-width">

                        <label for="fullAddress">Full Address:</label>

                        <input type="text"
                               id="fullAddress"
                               name="fullAddress"
                               value="{{ form_data.fullAddress|default:facility.street_address }}"
                               required>

                    </div>


                    <!-- CITY -->
                    <div class="form-group">

                        <label for="city">City:</label>

                        <input type="text"
                               id="city"
                               name="city"
                               value="{{ form_data.city|default:facility.city }}"
                               required>

                    </div>


                    <!-- PROVINCE -->
                    <div class="form-group">

                        <label for="province">Province:</label>

                        <input type="text"
                               id="province"
                               name="province"
                               value="{{ form_data.province|default:facility.province }}"
                               required>

                    </div>


                    <!-- COUNTRY -->
                    <div class="form-group">

                        <label for="country">Country:</label>

                        <input type="text"
                               id="country"
                               name="country"
                               value="{{ form_data.country|default:facility.country }}"
                               required>

                    </div>


                    <!-- POSTAL CODE -->
                    <div class="form-group">

                        <label for="pincode">Pincode / Postal Code:</label>

                        <input type="text"
                               id="pincode"
                               name="pincode"
                               value="{{ form_data.pincode|default:facility.postal_code }}"
                               required>

                    </div>

                </div>


                <!-- SAVE BUTTON -->
                <div>

                    <button type="submit" class="btn-submit">
                        Save Changes
                    </button>

                </div>


                <!-- FOOTER LINK -->
                <div class="auth-footer">

                    <a href="{% url 'home' %}">Back to Home</a>

                </div>

            </form>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 LifeLine. Emergency Rapid-Response Blood Dispatch System.
            All rights reserved.
        </p>

    </footer>


    <!-- CUSTOM TEXT-ONLY POPUP -->
    <div class="custom-popup-overlay" id="customPopupOverlay">

        <div class="custom-popup" id="customPopup">

            <p id="popupMessage"></p>

            <button type="button" onclick="closePopup()">
                OK
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // Show custom popup
        function showPopup(message, type) {

            const overlay = document.getElementById("customPopupOverlay");
            const popup = document.getElementById("customPopup");
            const popupMessage = document.getElementById("popupMessage");

            popupMessage.textContent = message;

            popup.className = "custom-popup popup-" + type;

            overlay.style.display = "flex";
        }


        // Close popup
        function closePopup() {

            document.getElementById("customPopupOverlay").style.display = "none";

        }


        // Locked fields popup
        function showLockedPopup() {

            showPopup(
                "This information cannot be changed here. Please contact LifeLine Support at emergency.lifelineservices999@gmail.com for assistance.",
                "info"
            );

        }


        // Django messages
        const djangoMessages = [

            {% for message in messages %}

                {
                    text: "{{ message|escapejs }}",
                    type: "{% if 'success' in message.tags %}success{% else %}error{% endif %}"
                },

            {% endfor %}

        ];


        // Display Django notifications
        djangoMessages.forEach(function(message) {

            showPopup(message.text, message.type);

        });


        // Display additional view error, if provided
        {% if error %}

            showPopup(
                "{{ error|escapejs }}",
                "error"
            );

        {% endif %}

    </script>

</body>
</html>
