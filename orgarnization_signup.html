<!--
  File Name: hospital_signup.html
  Project: Lifeline - Emergency Blood & Plasma Dispatch System
  
  Description: 
  This file serves as the Hospital & Blood Bank Staff Registration Page for 
  the Lifeline web application. Features:
  1. A custom image logo link in the navigation bar.
  2. A hidden role input passing 'hospital' directly to the backend.
  3. Structured fields for staff identity, employee ID (using the 'ST' prefix convention), work email, and facility type.
  4. Formatted address sections including a full-width address box, combined 
     city/province input, and a dedicated postal code field.
  5. Checkboxes for staff authorization confirmation and terms/privacy policy agreement.

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Standard HTML5 Metadata for Charset and Mobile Responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeline - Hospital & Blood Bank Sign Up</title>
    
    <!-- Linking the centralized global stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <!-- NAVIGATION BAR-->
    <!-- Contains custom logo image and sign-in link -->
  
    <header>
        <a href="index.html" class="logo-link">
            <img src="img/lifeline-logo.png" alt="LifeLine Logo" class="brand-logo">
        </a>
        <nav>
            <ul>
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="login.html" class="btn-nav-auth">Sign In</a></li>
            </ul>
        </nav>
    </header>


    <!-- MAIN CONTENT AREA: STAFF REGISTRATION FORM -->

    <main>
        <div class="auth-container">
            <h2>Hospital / Staff Registration</h2>
            
            <form action="login.html" method="POST" class="auth-form">
                
                <!-- Hidden Role Field: Quietly flags this user profile as 'hospital' in the database -->
                <input type="hidden" name="role" value="hospital">

                <!-- Two-Column Grid Wrapper for Form Fields -->
                <div class="form-grid">
                    
                    <!-- First Name Field -->
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>

                    <!-- Last Name Field -->
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>

                    <!-- Employee ID Field (Using ST prefix convention) -->
                    <div class="form-group">
                        <label for="username">Employee ID (e.g. stusername):</label>
                        <input type="text" id="username" name="username" placeholder="st..." required>
                    </div>

                    <!-- Work Email Address Field -->
                    <div class="form-group">
                        <label for="email">Work Email Address:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <!-- Organization Name Field -->
                    <div class="form-group">
                        <label for="organization">Organization Name:</label>
                        <input type="text" id="organization" name="organization" placeholder="e.g. City General Hospital" required>
                    </div>

                    <!-- Organization Phone Number Field -->
                    <div class="form-group">
                        <label for="phone">Organization Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <!-- Facility Type Dropdown Selection -->
                    <div class="form-group">
                        <label for="facilityType">Facility Type:</label>
                        <select id="facilityType" name="facilityType" required>
                            <option value="" disabled selected>Select facility type</option>
                            <option value="Hospital">Hospital</option>
                            <option value="Blood Bank">Blood Bank</option>
                        </select>
                    </div>

                    <!-- Full Address Box (Spans both columns for width) -->
                    <div class="form-group full-width">
                        <label for="fullAddress">Full Address:</label>
                        <input type="text" id="fullAddress" name="fullAddress" placeholder="Street address, building, suite, etc." required>
                    </div>

                    <!-- Combined City & Province Field -->
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" placeholder="e.g.Regina" required>
                    </div>

                    
                    <!-- Combined City & Province Field -->
                    <div class="form-group">
                        <label for="Province">Province:</label>
                        <input type="text" id="Province" name="Province" placeholder="e.g.SK" required>
                    </div>

                     <!-- Country Field -->
                    <div class="form-group">
                        <label for="country">Country:</label>
                        <input type="text" id="country" name="country" required>
                    </div>

                    <!-- Pincode / Postal Code Field -->
                    <div class="form-group">
                        <label for="pincode">Pincode / Postal Code:</label>
                        <input type="text" id="pincode" name="pincode" required>
                    </div>

                    <!-- Password Input Field -->
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <!-- Confirm Password Input Field -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>

                </div>

                <!-- Staff Authorization Confirmation Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="authorizedStaff" name="authorizedStaff" required>
                    <label for="authorizedStaff">I confirm that I am an authorized staff member of this organization</label>
                </div>

                <!-- Terms & Conditions Agreement Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the terms and privacy policy</label>
                </div>

                <!-- Form Submission Button -->
                <div>
                    <button type="submit" class="btn-submit">Register</button>
                </div>

                <!-- Footer link for users who already have an account -->
                <div class="auth-footer">
                    Already registered? <a href="login.html">Sign In</a>
                </div>

            </form>
        </div>
    </main>

    <!-- FOOTER SECTION-->
    <footer>
        <p>&copy; 2026 LifeLine. Emergency Rapid-Response Blood Dispatch System. All rights reserved.</p>
    </footer>

</body>
</html>
