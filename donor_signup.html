<!--
  File Name: donar_signup.html
  Project: Lifeline - Emergency Blood & Plasma Dispatch System
  
  Description: 
  This file serves as the Donor Registration Page for the Lifeline web 
  application. It provides a clean, responsive HTML5 form structured with a 
  two-column grid layout, featuring:
  1. A custom image logo link in the header.
  2. A hidden role input passing 'donor' directly to the backend.
  3. Structured fields for personal identity, contact info, date of birth, blood group, 
     and a username following the 'DO' prefix convention (e.g., doharshpatel).
  4. Formatted address sections including a full-width address box, combined 
     city/province input, and a dedicated postal code/pincode field.
  5. A centered professional profile photo upload card at the bottom of the form.
  6. Digital terms and privacy policy agreement checkbox before final registration.
-->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Standard HTML5 Metadata for Charset and Mobile Responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeline - Donor Sign Up</title>
    
    <!-- Linking the centralized global stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- NAVIGATION BAR-->
    <!-- Contains custom logo image and sign-in option -->
    <header>
        <a href="{% url 'home' %}" class="logo-link">
            <img src="{% static 'img/lifeline-logo.png' %}" alt="LifeLine Logo" class="brand-logo">
        </a>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}#about">About Us</a></li>
                <li><a href="{% url 'login' %}" class="btn-nav-auth">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT AREA: DONOR REGISTRATION FORM -->
    <main>
        <div class="auth-container">
            <h2>Donor Registration</h2>

            {% if error %}
                <div class="form-error-banner" id="form-error">
                    {{ error }}
                </div>
            {% endif %}
            
            <form action="{% url 'donor_signup' %}" method="POST" enctype="multipart/form-data" class="auth-form">
            {% csrf_token %}
                
                <!-- Hidden Role Field: Quietly flags this user profile as a 'donor' in the database -->
                <input type="hidden" name="role" value="donor">

                <!-- Two-Column Grid Wrapper for Form Fields -->
                <div class="form-grid">
                    
                    <!-- First Name Field -->
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName" value="{{ form_data.firstName|default:'' }}" required>
                    </div>

                    <!-- Last Name Field -->
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" value="{{ form_data.lastName|default:'' }}" required>
                    </div>

                    <!-- Username Field (Using 'DO' prefix convention) -->
                    <div class="form-group">
                        <label for="username">Username (e.g. dousername):</label>
                        <input type="text" id="username" name="username" placeholder="username" value="{{ form_data.username|default:'' }}" required>
                    </div>

                    <!-- Email Address Field -->
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" value="{{ form_data.email|default:'' }}" required>
                    </div>

                    <!-- Phone Number Field -->
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" value="{{ form_data.phone|default:'' }}" required>
                    </div>

                    <!-- Date of Birth Field -->
                    <div class="form-group">
                        <label for="dob">Date of Birth (DOB):</label>
                        <input type="date" id="dob" name="dob" value="{{ form_data.dob|default:'' }}" required>
                    </div>

                    <!-- Full Address Box (Spans both columns for width) -->
                    <div class="form-group full-width">
                        <label for="fullAddress">Full Address:</label>
                        <input type="text" id="fullAddress" name="fullAddress" placeholder="Street address, apartment, suite, etc." value="{{ form_data.fullAddress|default:'' }}" required>
                    </div>

                    <!-- City Field -->
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" placeholder="e.g. Regina" value="{{ form_data.city|default:'' }}" required>
                    </div>
                    
                    <!-- Province Field -->
                    <div class="form-group">
                        <label for="Province">Province:</label>
                        <input type="text" id="Province" name="Province" placeholder="e.g. SK" value="{{ form_data.Province|default:'' }}" required>
                    </div>

                    <!-- Country Field -->
                    <div class="form-group">
                        <label for="country">Country:</label>
                        <input type="text" id="country" name="country" value="{{ form_data.country|default:'' }}" required>
                    </div>

                    <!-- Pincode / Postal Code Field -->
                    <div class="form-group">
                        <label for="pincode">Pincode / Postal Code:</label>
                        <input type="text" id="pincode" name="pincode" value="{{ form_data.pincode|default:'' }}" required>
                    </div>

                    <!-- Blood Group Selection Dropdown -->
                    <div class="form-group">
                        <label for="bloodGroup">Blood Group:</label>
                        <select id="bloodGroup" name="bloodGroup" required>
                            <option value="" disabled {% if not form_data.bloodGroup %}selected{% endif %}>Select your blood type</option>
                            <option value="A+" {% if form_data.bloodGroup == "A+" %}selected{% endif %}>A+</option>
                            <option value="A-" {% if form_data.bloodGroup == "A-" %}selected{% endif %}>A-</option>
                            <option value="B+" {% if form_data.bloodGroup == "B+" %}selected{% endif %}>B+</option>
                            <option value="B-" {% if form_data.bloodGroup == "B-" %}selected{% endif %}>B-</option>
                            <option value="AB+" {% if form_data.bloodGroup == "AB+" %}selected{% endif %}>AB+</option>
                            <option value="AB-" {% if form_data.bloodGroup == "AB-" %}selected{% endif %}>AB-</option>
                            <option value="O+" {% if form_data.bloodGroup == "O+" %}selected{% endif %}>O+</option>
                            <option value="O-" {% if form_data.bloodGroup == "O-" %}selected{% endif %}>O-</option>
                        </select>
                    </div>

                    <!-- Password Input Field -->
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <!-- Confirm Password Input Field -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>

                </div>

                <!-- Modern Centered Profile Image Upload Card -->
                <div class="profile-upload-section" style="text-align: center; margin: 25px 0;">
                    <label class="profile-upload-label" style="display: block; margin-bottom: 10px; font-weight: 600;">Profile Photo</label>
                    <div class="profile-upload-card" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 15px;">
                        <div class="profile-avatar-preview" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: #eee;">
                            <img id="avatarPreview" src="{% static 'img/default-avatar.png' %}" alt="Avatar Preview" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="profile-upload-controls" style="display: flex; gap: 10px;">
                            <label for="profileImage" class="btn-change-photo" style="cursor: pointer;font-size: 14px;">Upload Photo</label>
                            <input type="file" id="profileImage" name="profileImage" accept="image/*" style="display: none;" onchange="loadPreview(event)">
                            <button type="button" id="removePhoto" onclick="clearPhoto()" style="font-size: 14px; cursor: pointer;">Remove</button>
                        </div>
                    </div>
                </div>

                <!-- Terms & Conditions Agreement Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" {% if form_data.terms %}checked{% endif %} required>
                    <label for="terms">I agree to the terms and privacy policy</label>
                </div>

                <!-- Form Submission Button -->
                <div>
                    <button type="submit" class="btn-submit">Sign Up</button>
                </div>

                <!-- Footer link for users who already have an account -->
                <div class="auth-footer">
                    Already registered? <a href="{% url 'login' %}">Sign In</a>
                </div>

            </form>
        </div>
    </main>

    <!-- FOOTER SECTION-->
    <footer>
        <p>&copy; 2026 LifeLine. Emergency Rapid-Response Blood Dispatch System. All rights reserved.</p>
    </footer>

{% if error %}
    <script>
        // Bring the validation error into view so the user does not miss it.
        document.getElementById("form-error").scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    </script>
{% endif %}

<script>
    // Live preview script for the profile image upload card
   function loadPreview(event) {
        const file = event.target.files[0];
        if (file) {
            // Check if the uploaded file is actually an image
            if (!file.type.startsWith('image/')) {
                alert('Please select a valid image file (JPG, PNG, WEBP, GIF, etc.)');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const output = document.getElementById('avatarPreview');
                output.src = e.target.result; // Dynamically renders JPG, PNG, WEBP, GIF, etc.
            };
            reader.readAsDataURL(file);
        }
    }
    function clearPhoto() {
        const input = document.getElementById('profileImage');
        const output = document.getElementById('avatarPreview');
        input.value = "";
        output.src = "{% static 'img/default-avatar.png' %}";
    }
</script>
</body>
</html>
