<!--
  File Name: donar_signup.html
  Project: Lifeline - Emergency Blood & Plasma Dispatch System
  
  Description: 
  This file serves as the Donor Registration Page for the Lifeline web 
  application. It provides a clean, responsive HTML5 form structured with a 
  two-column grid layout, featuring:
  1. A custom image logo link in the header.
  2. A hidden role input passing 'donor' directly to the backend.
  3. Structured fields for personal identity, contact info, date of birth, blood group, 
     and a username following the 'DO' prefix convention (e.g., doharshpatel).
  4. Formatted address sections including a full-width address box, combined 
     city/province input, and a dedicated postal code/pincode field.
  5. Digital terms and privacy policy agreement checkbox before final registration.

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Standard HTML5 Metadata for Charset and Mobile Responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeline - Donor Sign Up</title>
    
    <!-- Linking the centralized global stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <!-- NAVIGATION BAR-->
    <!-- Contains custom logo image and sign-in option -->

    <header>
        <a href="index.html" class="logo-link">
            <img src="img/lifeline-logo.png" alt="LifeLine Logo" class="brand-logo">
        </a>
        <nav>
            <ul>
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="login.html" class="btn-nav-auth">Sign In</a></li>
            </ul>
        </nav>
    </header>


    <!-- MAIN CONTENT AREA: DONOR REGISTRATION FORM -->

    <main>
        <div class="auth-container">
            <h2>Donor Registration</h2>
            
            <form action="login.html" method="POST" class="auth-form">
                
                <!-- Hidden Role Field: Quietly flags this user profile as a 'donor' in the database -->
                <input type="hidden" name="role" value="donor">

                <!-- Two-Column Grid Wrapper for Form Fields -->
                <div class="form-grid">
                    
                    <!-- First Name Field -->
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>

                    <!-- Last Name Field -->
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>

                    <!-- Username Field (Using 'DO' prefix convention) -->
                    <div class="form-group">
                        <label for="username">Username (e.g. dousername):</label>
                        <input type="text" id="username" name="username" placeholder="do..." required>
                    </div>

                    <!-- Email Address Field -->
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <!-- Phone Number Field -->
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <!-- Date of Birth Field -->
                    <div class="form-group">
                        <label for="dob">Date of Birth (DOB):</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <!-- Full Address Box (Spans both columns for width) -->
                    <div class="form-group full-width">
                        <label for="fullAddress">Full Address:</label>
                        <input type="text" id="fullAddress" name="fullAddress" placeholder="Street address, apartment, suite, etc." required>
                    </div>

                    <!-- Combined City & Province Field -->
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" placeholder="e.g. Regina" required>
                    </div>

                    
                    <!-- Combined City & Province Field -->
                    <div class="form-group">
                        <label for="Province">Province:</label>
                        <input type="text" id="Province" name="Province" placeholder="e.g.SK" required>
                    </div>

                     <!-- Country Field -->
                    <div class="form-group">
                        <label for="country">Country:</label>
                        <input type="text" id="country" name="country" required>
                    </div>

                    <!-- Pincode / Postal Code Field -->
                    <div class="form-group">
                        <label for="pincode">Pincode / Postal Code:</label>
                        <input type="text" id="pincode" name="pincode" required>
                    </div>

                    <!-- Blood Group Selection Dropdown -->
                    <div class="form-group">
                        <label for="bloodGroup">Blood Group:</label>
                        <select id="bloodGroup" name="bloodGroup" required>
                            <option value="" disabled selected>Select your blood type</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <!-- Password Input Field -->
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <!-- Confirm Password Input Field -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>

                </div>

                <!-- Terms & Conditions Agreement Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the terms and privacy policy</label>
                </div>

                <!-- Form Submission Button -->
                <div>
                    <button type="submit" class="btn-submit">Sign Up</button>
                </div>

                <!-- Footer link for users who already have an account -->
                <div class="auth-footer">
                    Already registered? <a href="login.html">Sign In</a>
                </div>

            </form>
        </div>
    </main>


    <!-- FOOTER SECTION-->
    <footer>
        <p>&copy; 2026 LifeLine. Emergency Rapid-Response Blood Dispatch System. All rights reserved.</p>
    </footer>

</body>
</html>
