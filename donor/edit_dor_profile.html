{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLine - Edit Profile</title>
  <link rel="stylesheet" href="{% static 'donor/css/styles.css' %}">
</head>

<body id="edit-profile-page">

  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <a href="{% url 'donor_dashboard' %}">
          <img src="{% static 'donor/image/logo.png' %}" alt="LifeLine Logo" class="logo-img">
        </a>
      </div>

      <div class="header-actions">
        <div class="dropdown">
          <button class="hamburger-btn" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="dropdown-content">
            <a href="{% url 'donor_dashboard' %}">Home</a>
            <a href="{% url 'logout' %}">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <section id="edit-profile-section" class="section">

      <div class="section-header">
        <h1>Edit Profile</h1>
      </div>

      {% if error %}
      <div class="profile-error" id="profile-error">
        {{ error }}
      </div>
      {% endif %}

      {% if messages %}
      {% for message in messages %}
      <div class="profile-success">
        {{ message }}
      </div>
      {% endfor %}
      {% endif %}

      <form method="POST" class="profile-form">
        {% csrf_token %}

        <!-- First Name and Last Name -->
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" value="{{ form_data.firstName|default:user.first_name }}"
              required>
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" value="{{ form_data.lastName|default:user.last_name }}"
              required>
          </div>
        </div>

        <!-- Username and Email -->
        <div class="form-row">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" value="{{ user.username }}" readonly>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ form_data.email|default:user.email }}" required>
          </div>
        </div>

        <!-- Phone and DOB -->
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" value="{{ form_data.phone|default:donor_profile.phone }}"
              required>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth (DOB)</label>
            <input type="date" id="dob" value="{{ donor_profile.date_of_birth|date:'Y-m-d' }}" readonly>
          </div>
        </div>

        <!-- Full Address -->
        <div class="form-group full-width">
          <label for="address">Full Address</label>
          <input type="text" id="address" name="address"
            value="{{ form_data.address|default:donor_profile.street_address }}" required>
        </div>

        <!-- City and Province -->
        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" value="{{ form_data.city|default:donor_profile.city }}" required>
          </div>

          <div class="form-group">
            <label for="province">Province</label>
            <input type="text" id="province" name="province"
              value="{{ form_data.province|default:donor_profile.province }}" required>
          </div>
        </div>

        <!-- Country and Postal Code -->
        <div class="form-row">
          <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" value="{{ form_data.country|default:donor_profile.country }}"
              required>
          </div>

          <div class="form-group">
            <label for="postalCode">Pincode / Postal Code</label>
            <input type="text" id="postalCode" name="postalCode"
              value="{{ form_data.postalCode|default:donor_profile.postal_code }}" required>
          </div>
        </div>

        <!-- Blood Group - Read Only -->
        <div class="form-group">
          <label for="bloodGroup">Blood Group</label>
          <input type="text" id="bloodGroup" value="{{ donor_profile.blood_type }}" readonly>
        </div>

        <!-- Profile Picture -->
        <div class="profile-upload-container">
          <label for="profilePicture" class="avatar-label">
            <img src="{% static 'donor/image/default-avatar.png' %}" alt="Current Profile" class="current-avatar">

            <span class="change-photo-link">
              Change Profile Picture
            </span>
          </label>

          <input type="file" id="profilePicture" name="profilePicture" accept="image/*" hidden>
        </div>

        <!-- Save Button -->
        <div class="form-actions">
          <button type="submit" class="btn btn-save">
            Save Changes
          </button>
        </div>

      </form>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hamburgerBtn = document.querySelector('.hamburger-btn');
      const dropdownContent = document.querySelector('.dropdown-content');

      if (hamburgerBtn && dropdownContent) {
        hamburgerBtn.addEventListener('click', (event) => {
          dropdownContent.classList.toggle('show');
          event.stopPropagation();
        });

        document.addEventListener('click', (event) => {
          if (!dropdownContent.contains(event.target)) {
            dropdownContent.classList.remove('show');
          }
        });
      }
    });
  </script>

</body>

</html>
